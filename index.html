<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainOrg LLC | Fractional Support for Nonprofits</title>
<meta name="description" content="RainOrg LLC — fractional leadership and business support for nonprofits and mission-driven organizations, built around what each organization actually needs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-blue:#023049;   /* wordmark / body text */
    --dark-teal:#136474;   /* gradient top */
    --teal:#34898F;        /* accents / brand name */
    --light-teal:#58B9B6;  /* gradient bottom */
    --teal-tint:#eaf5f4;
    --gray:#5b6472;
    --bg:#ffffff;
    --bg-soft:#f6f9f9;
    --border:#e3ebea;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--dark-blue);
    background:var(--bg);
    line-height:1.65;
  }
  a{color:var(--teal);text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  h1,h2,h3{font-weight:800;}

  /* Header */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;max-width:1080px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:64px;width:auto;}
  nav.links{display:flex;gap:28px;}
  nav.links a{color:var(--dark-blue);font-weight:500;font-size:15px;}
  nav.links a:hover{color:var(--teal);}
  .nav-cta{
    background:linear-gradient(135deg,var(--dark-teal),var(--light-teal));
    color:#fff;padding:9px 18px;border-radius:8px;
    font-weight:600;font-size:14px;
  }
  .nav-cta:hover{opacity:.9;}

  /* Hero */
  .hero{
    aspect-ratio:16/5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
    text-align:center;
    background-image:url('assets/hero-bg.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .hero-brand{
    font-size:60px;font-weight:800;letter-spacing:-.01em;
    color:var(--dark-blue);margin:0 0 14px;
  }
  .hero-logo{
    height:150px;width:auto;margin:0 auto 20px;
  }
  .slogan{
    font-style:italic;font-size:19px;color:var(--dark-teal);font-weight:500;
    margin:0 0 40px;
  }
  .hero h1{
    font-size:32px;margin:0 0 16px;letter-spacing:-.01em;font-weight:700;
    color:var(--teal);
    max-width:700px;margin-left:auto;margin-right:auto;
  }
  .hero p.desc{
    font-size:17px;color:var(--gray);max-width:600px;margin:0 auto 32px;
  }
  .hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{
    display:inline-block;padding:13px 26px;border-radius:9px;font-weight:600;font-size:15px;
    border:1px solid transparent;
  }
  .btn-primary{background:linear-gradient(135deg,var(--dark-teal),var(--light-teal));color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-secondary{background:#fff;color:var(--dark-blue);border-color:var(--border);}
  .btn-secondary:hover{border-color:var(--teal);color:var(--teal);}

  /* Sections */
  section{padding:72px 24px;}
  .section-alt{background:var(--bg-soft);}
  h2{font-size:30px;margin:0 0 8px;letter-spacing:-.01em;}
  .section-sub{color:var(--gray);font-size:16px;margin:0 0 40px;max-width:600px;}

  /* About */
  .about-grid{
    display:grid;grid-template-columns:340px 1fr;gap:44px;align-items:start;
  }
  .avatar-photo{
    width:340px;border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--border);flex-shrink:0;
  }
  .credentials{font-weight:600;color:var(--teal);font-size:15px;margin:0 0 14px;}
  .about-body p{color:var(--gray);margin:0 0 14px;}
  .about-body strong{color:var(--dark-blue);}
  .stat-strip{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px;}
  .stat-mini{flex:1;min-width:140px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;}
  .stat-mini .n{font-size:22px;font-weight:800;color:var(--dark-teal);}
  .stat-mini .l{font-size:13px;color:var(--gray);margin-top:2px;}

  /* Services */
  .cards{
    display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
  }
  .card{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:26px;
  }
  .card .icon{
    width:44px;height:44px;border-radius:10px;background:var(--teal-tint);
    display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px;
  }
  .card h3{font-size:17px;margin:0 0 8px;}
  .card p{color:var(--gray);font-size:14.5px;margin:0;}

  /* RainOrg section */
  .rain-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  .rain-grid p{color:var(--gray);}
  .pill-list{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px;}
  .pill-list li{
    background:var(--teal-tint);color:var(--dark-blue);font-size:14px;font-weight:600;
    padding:8px 14px;border-radius:999px;
  }
  .rain-side{display:flex;flex-direction:column;gap:22px;}
  .rain-visual{
    background:linear-gradient(160deg,var(--dark-teal),var(--light-teal));
    border-radius:var(--radius);padding:44px 32px;text-align:center;color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .rain-visual img{
    height:96px;width:auto;margin:0 auto;
    filter:brightness(0) invert(1);
  }
  .team-photo{
    border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);
    aspect-ratio:4/3;
  }
  .team-photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}

  /* Contact */
  .contact-grid{
    display:flex;flex-direction:column;align-items:center;gap:32px;
    max-width:560px;margin:0 auto;text-align:center;
  }
  .contact-grid form{width:100%;text-align:left;}
  .contact-info p{color:var(--gray);}
  .contact-info a{font-weight:600;}
  .contact-detail{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:15px;}
  .contact-detail .icon-sm{
    width:36px;height:36px;border-radius:8px;background:var(--teal-tint);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;
  }
  form{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:28px;display:flex;flex-direction:column;gap:16px;
  }
  label{font-size:13px;font-weight:700;color:var(--dark-blue);margin-bottom:-8px;}
  input,textarea{
    padding:12px 14px;border:1px solid var(--border);border-radius:8px;
    font-size:15px;font-family:inherit;width:100%;
  }
  input:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  textarea{resize:vertical;min-height:120px;}
  .submit-btn{
    background:linear-gradient(135deg,var(--dark-teal),var(--light-teal));color:#fff;border:none;padding:13px 22px;border-radius:9px;
    font-weight:700;font-size:15px;cursor:pointer;
  }
  .submit-btn:hover{opacity:.9;}
  .form-note{font-size:13px;color:var(--gray);}

  footer{
    padding:32px 24px;text-align:center;color:var(--gray);font-size:14px;
    border-top:1px solid var(--border);
  }
  footer img{height:20px;margin:0 auto 8px;}

  @media (max-width:800px){
    nav.links{display:none;}
    .hero{aspect-ratio:unset;min-height:320px;}
    .hero-brand{font-size:44px;}
    .hero-logo{height:90px;}
    .hero h1{font-size:26px;}
    .about-grid,.rain-grid,.contact-grid{grid-template-columns:1fr;}
    .avatar-photo{width:260px;margin:0 auto;}
    .cards{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand"><img src="assets/logo.png" alt="RainOrg LLC logo"></div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <img src="assets/logo.png" alt="RainOrg LLC logo" class="hero-logo">
    <p class="slogan">"Nourishing business growth through fractional leadership."</p>
  </div>
</section>

<section id="contact" class="section-alt">
  <div class="wrap contact-grid">
    <div class="contact-info">
      <h2>Let's Talk</h2>
      <p>Interested in working together? Send a message using the form and we'll get back to you as soon as possible.</p>
    </div>

    <form action="https://formsubmit.co/mauricio@rainorg.com" method="POST">
      <input type="hidden" name="_subject" value="New message from RainOrg website">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="true">

      <label for="name">Name</label>
      <input type="text" id="name" name="Name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="Email" required>

      <label for="message">Message</label>
      <textarea id="message" name="Message" required></textarea>

      <button type="submit" class="submit-btn">Send Message</button>
      <p class="form-note">We don't share your information with anyone else.</p>
    </form>
  </div>
</section>

<footer>
  <img src="assets/logo.png" alt="RainOrg LLC logo">
  © <span id="year"></span> RainOrg LLC. All rights reserved.
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
